<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <title>Чайная витрина</title>
    <link rel="icon" href="/favicon.ico" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      (function () {
        function fromFragment(raw, key) {
          var text = raw || '';
          if (text.charAt(0) === '#' || text.charAt(0) === '?') {
            text = text.slice(1);
          }
          return new URLSearchParams(text).get(key) || '';
        }
        var fromSdk =
          window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData
            ? window.Telegram.WebApp.initData
            : '';
        var data =
          fromSdk ||
          fromFragment(window.location.hash, 'tgWebAppData') ||
          fromFragment(window.location.search, 'tgWebAppData');
        if (!data) {
          try {
            data = sessionStorage.getItem('tg_init_data') || '';
          } catch (error) {
            data = '';
          }
        }
        if (data) {
          window.__TG_INIT_DATA__ = data;
          try {
            sessionStorage.setItem('tg_init_data', data);
          } catch (error) {}
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
