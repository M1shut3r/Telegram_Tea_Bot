<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0c10" />
    <title>ЖИЛИПИЛИ</title>
    <link rel="icon" href="/favicon.ico" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      (function () {
        var tg = window.Telegram && window.Telegram.WebApp;
        if (tg) {
          if (typeof tg.ready === 'function') {
            tg.ready();
          }
          if (typeof tg.expand === 'function') {
            tg.expand();
          }
          if (tg.isFullscreen === true && typeof tg.exitFullscreen === 'function') {
            try {
              tg.exitFullscreen();
            } catch (error) {}
          }
          if (typeof tg.disableVerticalSwipes === 'function') {
            tg.disableVerticalSwipes();
          }
        }
        function fromFragment(raw, key) {
          var text = raw || '';
          if (text.charAt(0) === '#' || text.charAt(0) === '?') {
            text = text.slice(1);
          }
          return new URLSearchParams(text).get(key) || '';
        }
        var fromSdk = tg && tg.initData ? tg.initData : '';
        var data =
          fromSdk ||
          fromFragment(window.location.hash, 'tgWebAppData') ||
          fromFragment(window.location.search, 'tgWebAppData');
        if (!data) {
          try {
            data = sessionStorage.getItem('tg_init_data') || '';
          } catch (error) {
            data = '';
          }
        }
        if (data) {
          window.__TG_INIT_DATA__ = data;
          try {
            sessionStorage.setItem('tg_init_data', data);
          } catch (error) {}
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Russo+One&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
